[package]
name = "token-metadata"
version = "0.1.0"
edition = "2021"
description = "Lean, zero-copy, no_std metadata program for SPL Token / Token-2022 mints (fungible-focused, no NFT/edition machinery)."
license = "Apache-2.0"

[lib]
name = "token_metadata"
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []

[dependencies]
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
pinocchio = { version = "0.11", features = ["cpi"] }
pinocchio-system = "0.6"
pinocchio-token = "0.6"
pinocchio-token-2022 = "0.3"
solana-address = { version = "2", features = ["decode", "bytemuck"] }

[dev-dependencies]
litesvm = "0.12"
solana-address = { version = "2", features = ["curve25519"] }
solana-account = "3.2"
solana-hash = "3.1"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-message = "3.1"
solana-signer = "3.0"
solana-transaction = { version = "3", features = ["verify", "bincode"] }
solana-transaction-error = "3"
